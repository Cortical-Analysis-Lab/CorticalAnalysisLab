name: Update summer research catalog

on:
  workflow_dispatch:
    inputs:
      time_budget_minutes:
        description: Maximum discovery-session runtime in minutes
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "240"
      notify_with_issue:
        description: Open a GitHub issue with the completed session report
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: summer-research-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-rebuild-validate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run catalog-aware discovery session
        run: |
          python scripts/run_discovery_session.py \
            --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --output discovery-session

      - name: Publish discovery report in workflow summary
        run: cat discovery-session/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery inventory and report
        uses: actions/upload-artifact@v4
        with:
          name: summer-research-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: discovery-session/
          if-no-files-found: error
          retention-days: 90

      - name: Rebuild canonical database and generated exports
        run: python scripts/rebuild_database.py

      - name: Export review workbook
        run: python scripts/export_review_xlsx.py

      - name: Run catalog regression tests
        run: python scripts/test_catalog.py

      - name: Check generated changes
        run: git diff --check

      - name: Commit regenerated catalog artifacts
        run: |
          if git diff --quiet; then
            echo "Catalog artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/research_opportunities.sqlite data/summer-research
          git commit -m "Update summer research catalog artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Notify completion with a GitHub issue
        if: ${{ inputs.notify_with_issue }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Catalog discovery session ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} complete" \
            --body-file discovery-session/summary.md
