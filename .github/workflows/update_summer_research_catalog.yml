name: Update summer research catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: summer-research-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Rebuild canonical database and generated exports
        run: python scripts/rebuild_database.py

      - name: Export review workbook
        run: python scripts/export_review_xlsx.py

      - name: Run catalog regression tests
        run: python scripts/test_catalog.py

      - name: Check generated changes
        run: git diff --check

      - name: Commit regenerated catalog artifacts
        run: |
          if git diff --quiet; then
            echo "Catalog artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/research_opportunities.sqlite data/summer-research
          git commit -m "Update summer research catalog artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
