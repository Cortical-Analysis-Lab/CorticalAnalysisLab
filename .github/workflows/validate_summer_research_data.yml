name: Validate summer research catalog

on:
  push:
    paths:
      - "database/**"
      - "schema/**"
      - "scripts/**"
      - "data/summer-research/**"
  pull_request:
    paths:
      - "database/**"
      - "schema/**"
      - "scripts/**"
      - "data/summer-research/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/export_catalog.py --output /tmp/catalog-export
      - run: python scripts/test_catalog.py
